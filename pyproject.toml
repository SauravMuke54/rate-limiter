[project]
name = "rate-limiter"
version = "0.1.0"
description = "A python based rate limiter to limit request and avoid server from overhead of requests"
authors = [
    {name = "Saurav Muke"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard] (>=0.128.0,<0.129.0)",
    "redis (>=7.1.0,<8.0.0)",
    "httpx (>=0.27.0,<0.28.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
fakeredis = "^2.24.0"
ruff = "^0.16.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "G", "RUF", "TRY"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"